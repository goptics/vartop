{{define "confirm"}}<section class="confirm">
  <h3>Confirm {{.Action}} on {{.Server}}</h3>
  <p>{{.Action}} each worker on each pod below:</p>
  <div class="table-wrap">
  <table>
    <thead><tr><th>Worker</th>{{range .Pods}}<th title="{{.Endpoint}}">{{.Label}}</th>{{end}}</tr></thead>
    <tbody>{{range $name := .Names}}
    <tr><th scope="row" class="name">{{$name}}</th>{{range $.Pods}}<td>{{$.Action}}</td>{{end}}</tr>{{end}}
    </tbody>
  </table>
  </div>
  <form hx-post="/bulk/{{pathEscape .Action}}" hx-target="#results" hx-swap="innerHTML" hx-sync="#page:replace">
    {{template "server_field" .}}
    <input type="hidden" name="pod" value="{{.Pod}}">
    <input type="hidden" name="confirm" value="1">
    {{range .Names}}<input type="hidden" name="names" value="{{.}}">
    {{end}}<button type="submit" class="danger">Confirm {{.Action}}</button>
  </form>
</section>{{end}}
