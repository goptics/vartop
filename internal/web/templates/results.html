{{define "results"}}{{if .Results}}<ul class="results">{{range .Results}}
  <li class="{{if eq .Outcome "ok"}}ok{{else if eq .Outcome "failed"}}failed{{else}}nochange{{end}}"><svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">{{if eq .Outcome "ok"}}<path d="M3.5 8.5 6.5 11.5 12.5 4.5"/>{{else if eq .Outcome "failed"}}<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>{{else}}<path d="M4 8h8"/>{{end}}</svg>{{with .Worker}}<span class="worker">{{.}}</span> on {{end}}<span class="pod" title="{{.Tip}}">{{.Pod}}</span> <span class="outcome">{{.Outcome}}{{if .Msg}} ({{.Msg}}){{end}}</span></li>{{end}}
</ul>{{else}}<p class="empty">No {{.Noun.Many}} were targeted.</p>{{end}}{{end}}
