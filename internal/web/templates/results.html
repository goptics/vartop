{{define "results"}}{{if .Results}}<ul class="results">{{range .Results}}
  <li class="{{if eq .Outcome "ok"}}ok{{else if eq .Outcome "failed"}}failed{{else}}nochange{{end}}">{{with .Worker}}<span class="worker">{{.}}</span> on {{end}}<span class="pod" title="{{.Tip}}">{{.Pod}}</span> <span class="outcome">{{.Outcome}}{{if .Msg}} ({{.Msg}}){{end}}</span></li>{{end}}
</ul>{{else}}<p class="empty">No {{.Noun.Many}} were targeted.</p>{{end}}{{end}}
